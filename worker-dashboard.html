<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Worker Dashboard - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fefcf5; color: #1e2a2f; padding: 20px; }
        .container { max-width: 1280px; margin: 0 auto; background: white; border-radius: 32px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08); overflow: hidden; }
        
        .header { background: linear-gradient(135deg, #c49a6c, #a57c52); padding: 24px 28px; color: white; }
        .header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 16px; }
        
        .search-area { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 10px; }
        .search-box { flex: 2; display: flex; background: white; border-radius: 60px; overflow: hidden; }
        .search-box input { flex: 1; padding: 14px 20px; border: none; font-size: 1rem; outline: none; }
        .search-box button { background: #c49a6c; border: none; padding: 0 24px; color: white; cursor: pointer; }

        .main-content { padding: 28px; }
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: baseline; }
        
        .workers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .worker-card { background: #ffffff; border-radius: 28px; padding: 20px; box-shadow: 0 6px 14px rgba(0,0,0,0.05); border: 1px solid #f0e4d8; transition: 0.2s; cursor: pointer; }
        .worker-card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.12); }
        
        .avatar { width: 70px; height: 70px; border-radius: 50%; background-size: cover; background-position: center; border: 2px solid #c49a6c; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 50px; background: #d4f5d0; color: #2e6b1f; }
        
        .view-profile-btn { background: transparent; border: 2px solid #c49a6c; color: #c49a6c; padding: 8px 16px; border-radius: 40px; font-weight: 600; width: 100%; margin-top: 12px; cursor: pointer; transition: 0.2s; }
        .view-profile-btn:hover { background: #c49a6c; color: white; }

        .bottom-nav { display: flex; justify-content: space-around; background: white; padding: 14px 20px; border-top: 1px solid #ede3d7; }
        .nav-item { text-align: center; color: #8b7a67; text-decoration: none; font-size: 0.75rem; }
        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 4px; }
        .nav-item.active { color: #c49a6c; }

        .loading-spinner { text-align: center; padding: 50px; color: #c49a6c; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; background: white; border-bottom: 1px solid #f0e4d8;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logo.png" alt="logo" style="height: 40px;" onerror="this.src='https://placehold.co/40x40?text=BS'">
            <span style="font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #c49a6c, #8b5a2b); -webkit-background-clip: text; background-clip: text; color: transparent;">BELG SERVICES</span>
        </div>
        <ul style="display: flex; gap: 28px; list-style: none; align-items: center;">
            <li><a href="index.html" style="text-decoration: none; color: #2c3e2f;">Home</a></li>
            <li><a href="worker-dashboard.html" style="text-decoration: none; color: #c49a6c; font-weight: 600;">Workers</a></li>
            <li><a href="contact.html" style="text-decoration: none; color: #2c3e2f;">Contact</a></li>
        </ul>
    </div>

    <div class="header">
        <h1><i class="fas fa-user-hard-hat"></i> Find Skilled Workers</h1>
        <div class="search-area">
            <div class="search-box">
                <input type="text" id="workerSearch" placeholder="Search by name or skill (e.g. Painter, Cleaner)...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="section-title">Verified Professionals</div>
        <div class="workers-grid" id="workersContainer">
            <div class="loading-spinner">Loading expert workers...</div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="worker-dashboard.html" class="nav-item active"><i class="fas fa-search"></i> Discover</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Messages</a>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-user-cog"></i> My Account</a>
    </div>
</div>

<script>
    const sb = supabase.createClient(window.env.URL, window.env.KEY);

    async function fetchWorkers() {
        const container = document.getElementById('workersContainer');
        
        // جلب المستخدمين الذين دورهم 'worker' من Supabase
        const { data: workers, error } = await sb
            .from('profiles')
            .select('*')
            .eq('role', 'worker');

        if (error) {
            container.innerHTML = `<p style="color:red; text-align:center;">Error loading workers. Please refresh.</p>`;
            return;
        }

        if (workers.length === 0) {
            container.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">No workers registered yet.</p>`;
            return;
        }

        renderList(workers);
    }

    function renderList(list) {
        const container = document.getElementById('workersContainer');
        container.innerHTML = list.map(w => `
            <div class="worker-card" onclick="window.location.href='worker-profile.html?id=${w.id}'">
                <div class="card-header">
                    <div class="avatar" style="background-image: url('${w.avatar_url || 'https://via.placeholder.com/150'}')"></div>
                    <div>
                        <div class="worker-name">${w.full_name}</div>
                        <div class="status-badge"><i class="fas fa-check-circle"></i> Verified</div>
                    </div>
                </div>
                <div style="font-size: 0.9rem; color: #6e5e4a; margin: 10px 0; height: 40px; overflow: hidden;">
                    ${w.bio || 'Expert service provider ready to help with your next project.'}
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <span style="font-weight: 800; color: #a57c52;">Professional</span>
                    <span style="color: #f5b042;"><i class="fas fa-star"></i> ${w.rating || '5.0'}</span>
                </div>
                <button class="view-profile-btn">View Profile →</button>
            </div>
        `).join('');
    }

    // نظام البحث الحي
    document.getElementById('workerSearch').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const cards = document.querySelectorAll('.worker-card');
        cards.forEach(card => {
            const name = card.querySelector('.worker-name').innerText.toLowerCase();
            card.style.display = name.includes(term) ? 'block' : 'none';
        });
    });

    fetchWorkers();
</script>
</body>
</html>
