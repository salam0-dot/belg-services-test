<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Find Workers - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fefcf5; color: #1e2a2f; }
        .container { max-width: 1280px; margin: 0 auto; background: white; border-radius: 32px; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08); overflow: hidden; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; background: white; border-bottom: 1px solid #f0e4d8; flex-wrap: wrap; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 40px; width: auto; }
        .logo-text { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #c49a6c, #8b5a2b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; font-weight: 500; color: #2c3e2f; transition: 0.2s; }
        .nav-links a:hover { color: #c49a6c; }
        .nav-links a.active { color: #c49a6c; font-weight: 600; }
        .join-btn { background: #c49a6c; color: white !important; padding: 8px 24px; border-radius: 40px; }
        .header { background: linear-gradient(135deg, #c49a6c, #a57c52); padding: 30px 28px; color: white; }
        .header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 16px; }
        .search-area { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .search-box { flex: 2; display: flex; background: white; border-radius: 60px; overflow: hidden; }
        .search-box input { flex: 1; padding: 14px 20px; border: none; font-size: 1rem; outline: none; }
        .search-box button { background: #c49a6c; border: none; padding: 0 24px; color: white; cursor: pointer; }
        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .filter-btn { background: rgba(255,255,255,0.2); border: none; padding: 6px 16px; border-radius: 40px; color: white; cursor: pointer; }
        .filter-btn.active { background: white; color: #c49a6c; }
        .main-content { padding: 28px; }
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .workers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .worker-card { background: #ffffff; border-radius: 28px; padding: 20px; box-shadow: 0 6px 14px rgba(0,0,0,0.05); border: 1px solid #f0e4d8; transition: 0.2s; cursor: pointer; }
        .worker-card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.12); }
        .card-header { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; background-size: cover; background-position: center; border: 3px solid #c49a6c; background-color: #f0e4d8; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #c49a6c; }
        .worker-name { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 50px; background: #d4f5d0; color: #2e6b1f; }
        .status-badge.offline { background: #ffe0e0; color: #c44; }
        .skills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
        .skill-tag { background: #f0e4d8; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; }
        .price { font-weight: 800; color: #c49a6c; }
        .rating { color: #f5b042; }
        .view-profile-btn { background: transparent; border: 2px solid #c49a6c; color: #c49a6c; padding: 10px; border-radius: 40px; font-weight: 600; width: 100%; margin-top: 12px; cursor: pointer; transition: 0.2s; }
        .view-profile-btn:hover { background: #c49a6c; color: white; }
        .bottom-nav { display: flex; justify-content: space-around; background: white; padding: 14px 20px; border-top: 1px solid #ede3d7; }
        .nav-item { text-align: center; color: #8b7a67; text-decoration: none; font-size: 0.75rem; }
        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 4px; }
        .nav-item.active { color: #c49a6c; }
        .loading { text-align: center; padding: 50px; color: #c49a6c; }
        .empty { text-align: center; padding: 50px; color: #999; }
        @media (max-width: 768px) { .navbar { flex-direction: column; } .workers-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="navbar">
        <div class="logo-area">
            <img src="logo.png" alt="logo" class="logo-img" onerror="this.src='https://placehold.co/40x40?text=BS'">
            <span class="logo-text">BELG SERVICES</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="worker-dashboard.html" class="active">Workers</a></li>
            <li><a href="company-dashboard.html">Companies</a></li>
            <li><a href="register.html" class="join-btn">Join as Worker</a></li>
        </ul>
    </div>

    <div class="header">
        <h1><i class="fas fa-user-hard-hat"></i> Find Skilled Workers</h1>
        <p>Connect with verified professionals across Belgium</p>
        <div class="search-area">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name or profession...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="available">Available Now</button>
        </div>
    </div>

    <div class="main-content">
        <div class="section-title">Verified Professionals</div>
        <div class="workers-grid" id="workersContainer">
            <div class="loading">Loading workers...</div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="worker-dashboard.html" class="nav-item active"><i class="fas fa-search"></i> Discover</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Messages</a>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-user-cog"></i> My Account</a>
    </div>
</div>

<script>
    let allWorkers = [];
    let currentFilter = 'all';
    let currentSearch = '';

    async function loadWorkers() {
        const container = document.getElementById('workersContainer');
        container.innerHTML = '<div class="loading">Loading workers...</div>';
        
        const { data: workersData, error: workersError } = await sb
            .from('workers')
            .select('*, profiles!inner(*)');
        
        if (workersError) {
            container.innerHTML = '<div class="empty">Error loading workers. Please refresh.</div>';
            return;
        }
        
        if (!workersData || workersData.length === 0) {
            container.innerHTML = '<div class="empty">No workers registered yet. <a href="register.html">Join as a worker</a> to be the first!</div>';
            return;
        }
        
        allWorkers = workersData;
        renderWorkers();
    }
    
    async function loadWorkerSkills(workerId) {
        const { data } = await sb.from('worker_skills').select('skills(*)').eq('worker_id', workerId);
        if (data && data.length > 0) {
            return data.map(ws => ws.skills?.name).filter(Boolean);
        }
        return [];
    }
    
    async function renderWorkers() {
        const container = document.getElementById('workersContainer');
        let filtered = [...allWorkers];
        
        if (currentFilter === 'available') {
            filtered = filtered.filter(w => w.is_available === true);
        }
        
        if (currentSearch) {
            const searchLower = currentSearch.toLowerCase();
            filtered = filtered.filter(w => 
                w.profiles?.full_name?.toLowerCase().includes(searchLower) ||
                w.profession?.toLowerCase().includes(searchLower)
            );
        }
        
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty">No workers match your search.</div>';
            return;
        }
        
        const workerCards = [];
        for (const worker of filtered) {
            const profile = worker.profiles;
            const skills = await loadWorkerSkills(worker.id);
            const ratingValue = worker.rating_avg || 0;
            const stars = '★'.repeat(Math.floor(ratingValue)) + '☆'.repeat(5 - Math.floor(ratingValue));
            
            workerCards.push(`
                <div class="worker-card" onclick="window.location.href='worker-profile.html?id=${worker.id}'">
                    <div class="card-header">
                        <div class="avatar">
                            ${profile?.avatar_url ? `<img src="${profile.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : '<i class="fas fa-user"></i>'}
                        </div>
                        <div>
                            <div class="worker-name">${profile?.full_name || 'Worker'}</div>
                            <div class="status-badge ${worker.is_available ? '' : 'offline'}">
                                <i class="fas ${worker.is_available ? 'fa-check-circle' : 'fa-clock'}"></i>
                                ${worker.is_available ? 'Available Now' : 'Busy'}
                            </div>
                        </div>
                    </div>
                    <div style="font-weight: 600; color: #c49a6c; margin-bottom: 5px;">${worker.profession || 'Professional'}</div>
                    <div class="skills">
                        ${skills.slice(0, 3).map(s => `<span class="skill-tag">${s}</span>`).join('')}
                        ${skills.length > 3 ? `<span class="skill-tag">+${skills.length - 3}</span>` : ''}
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin: 12px 0;">
                        <span class="price">€${worker.hourly_rate || 'negotiable'}/hour</span>
                        <span class="rating"><i class="fas fa-star"></i> ${ratingValue.toFixed(1)} (${worker.rating_count || 0})</span>
                    </div>
                    <button class="view-profile-btn">View Profile →</button>
                </div>
            `);
        }
        
        container.innerHTML = workerCards.join('');
    }
    
    document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderWorkers();
    });
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.getAttribute('data-filter');
            renderWorkers();
        });
    });
    
    loadWorkers();
</script>
</body>
</html>
