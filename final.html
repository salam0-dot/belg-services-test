<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELG - Direct Sign Up</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #c49a6c; color: white; font-weight: bold; border: none; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>BELG SERVICES - Sign Up (Direct)</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <div id="message"></div>

    <script>
        const SUPABASE_URL = 'https://yljlpvotsysvppimmoxh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_6iHIGUlF5Y9emm6ig238Vg_3he7bc-b';

        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!email || !password) {
                messageDiv.innerHTML = '<span class="error">Please fill in all fields</span>';
                return;
            }
            
            messageDiv.innerHTML = 'Creating account...';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error_description || data.message || 'Registration failed');
                }
                
                messageDiv.innerHTML = '<span class="success">✅ Success! User ID: ' + data.id + '</span>';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                
            } catch (error) {
                messageDiv.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
            }
        }
    </script>
</body>
</html>
