<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Supabase Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>BELG SERVICES - Direct Supabase Test</h2>
    <button onclick="testDirect()">Click to Test Supabase Connection</button>
    <pre id="output"></pre>

    <script>
        const supabaseUrl = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
        const supabaseKey = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function testDirect() {
            const output = document.getElementById('output');
            output.innerText = "Testing connection...";
            
            try {
                // Simple test: try to get current session
                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                
                output.innerText = "✅ Supabase connection successful! Session: " + JSON.stringify(data, null, 2);
            } catch (err) {
                output.innerText = "❌ Connection failed: " + err.message;
            }
        }
    </script>
</body>
</html>
