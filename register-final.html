<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BELG SERVICES</title>
    <!-- تحميل مكتبة Supabase من رابط بديل (Cloudflare) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.0/supabase-umd.min.js"></script>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #c49a6c; color: white; border: none; cursor: pointer; font-weight: bold; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>BELG SERVICES - Create Account</h2>
    <input type="text" id="fullName" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <select id="userType">
        <option value="client">Client</option>
        <option value="worker">Worker</option>
        <option value="company">Company</option>
    </select>
    <button onclick="register()">Create Account</button>
    <div id="message"></div>

    <script>
        // Supabase credentials
        const SUPABASE_URL = 'https://dhvdohzjfmxmfxbinqsj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_53zXqL_1ykPehXSQed-EfA_XEJ2rxzM';
        
        // Check if Supabase is loaded
        if (typeof supabase === 'undefined') {
            document.getElementById('message').innerHTML = '<span class="error">Error: Could not load security library. Please check your connection.</span>';
        } else {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            window.register = async function() {
                const fullName = document.getElementById('fullName').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const userType = document.getElementById('userType').value;
                const messageDiv = document.getElementById('message');
                
                if (!fullName || !email || !password) {
                    messageDiv.innerHTML = '<span class="error">Please fill in all fields</span>';
                    return;
                }
                
                messageDiv.innerHTML = 'Creating account...';
                
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            user_type: userType
                        }
                    }
                });
                
                if (error) {
                    messageDiv.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
                } else {
                    messageDiv.innerHTML = '<span class="success">Success! Account created. Check your email.</span>';
                    // Clear form
                    document.getElementById('fullName').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                }
            };
        }
    </script>
</body>
</html>
