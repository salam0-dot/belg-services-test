<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - BELG SERVICES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #fefcf5 0%, #f9f3e9 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .login-container { max-width: 480px; width: 100%; background: white; border-radius: 48px; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.15); overflow: hidden; }
        .login-header { background: linear-gradient(135deg, #c49a6c, #a57c52); padding: 32px 28px; text-align: center; color: white; }
        .login-header i { font-size: 3rem; margin-bottom: 12px; }
        .login-header h1 { font-size: 1.9rem; font-weight: 700; }
        .login-header p { font-size: 0.9rem; opacity: 0.85; margin-top: 8px; }
        .login-body { padding: 36px 32px; }
        .input-group { margin-bottom: 22px; }
        .input-group label { display: block; font-weight: 500; margin-bottom: 8px; color: #2c3e2f; font-size: 0.85rem; }
        .input-group input { width: 100%; padding: 14px 18px; border: 1.5px solid #e2cfbc; border-radius: 60px; font-family: 'Inter', sans-serif; font-size: 0.95rem; background: white; }
        .input-group input:focus { outline: none; border-color: #c49a6c; box-shadow: 0 0 0 3px rgba(196,154,108,0.1); }
        .login-btn { width: 100%; background: #c49a6c; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 700; border-radius: 60px; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
        .login-btn:hover { background: #a57c52; }
        .register-link { text-align: center; font-size: 0.85rem; color: #5a6e4a; }
        .register-link a { color: #c49a6c; text-decoration: none; font-weight: 600; }
        .back-home { display: block; text-align: center; margin-top: 24px; text-decoration: none; color: #8b7a67; font-size: 0.8rem; }
        .error-msg { color: red; text-align: center; margin-bottom: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-user-circle"></i>
            <h1>Welcome Back</h1>
            <p>Sign in to your BELG SERVICES account</p>
        </div>

        <div class="login-body">
            <div id="errorMsg" class="error-msg"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="hello@belgservices.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn">Sign In →</button>

                <div class="register-link">Don't have an account? <a href="register.html">Join now</a></div>
                <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            
            errorDiv.innerHTML = '';
            
            try {
                const data = await window.Auth.signIn(email, password);
                if (data.user) {
                    window.location.href = "dashboard.html";
                }
            } catch (error) {
                errorDiv.innerHTML = '❌ ' + error.message;
            }
        });
    </script>
</body>
</html>
