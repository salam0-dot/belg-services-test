<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Worker Profile - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fefcf5; color: #1e2a2f; }
        .container { max-width: 1000px; margin: 20px auto; background: white; border-radius: 32px; overflow: hidden; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08); }
        .cover { height: 180px; background: linear-gradient(135deg, #c49a6c, #a57c52); }
        .profile-header { padding: 0 28px 28px; text-align: center; margin-top: -60px; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid white; background: white; margin: 0 auto 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #f0e4d8; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar i { font-size: 60px; color: #c49a6c; }
        h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .profession { color: #c49a6c; font-weight: 600; margin-bottom: 10px; }
        .rating { color: #f5b042; margin-bottom: 15px; }
        .status { display: inline-block; padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; margin: 10px 0; }
        .status.available { background: #d4f5d0; color: #2e6b1f; }
        .status.busy { background: #ffe0e0; color: #c44; }
        .section { padding: 20px 28px; border-top: 1px solid #f0e4d8; }
        .section h3 { margin-bottom: 15px; color: #c49a6c; }
        .skills { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag { background: #f0e4d8; padding: 6px 16px; border-radius: 30px; font-size: 0.85rem; }
        .pricing { display: flex; gap: 20px; flex-wrap: wrap; }
        .price-card { background: #fefcf5; padding: 15px; border-radius: 20px; flex: 1; text-align: center; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .portfolio-item { border-radius: 16px; overflow: hidden; border: 1px solid #f0e4d8; }
        .portfolio-item img, .portfolio-item video { width: 100%; height: 120px; object-fit: cover; }
        .reviews { margin-top: 20px; }
        .review { background: #fefcf5; padding: 15px; border-radius: 20px; margin-bottom: 10px; }
        .contact-btn { background: #c49a6c; color: white; border: none; padding: 14px 30px; border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 15px; }
        .back-btn { background: transparent; border: 2px solid #c49a6c; color: #c49a6c; padding: 10px 20px; border-radius: 40px; cursor: pointer; margin-bottom: 15px; }
        @media (max-width: 768px) { .container { margin: 10px; } .pricing { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container">
    <div style="padding: 15px 28px 0;">
        <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button>
    </div>
    <div class="cover"></div>
    <div class="profile-header" id="profileHeader">
        <div class="avatar" id="avatar">
            <i class="fas fa-user"></i>
        </div>
        <h1 id="workerName">Loading...</h1>
        <div class="profession" id="profession"></div>
        <div class="rating" id="rating"></div>
        <div class="status" id="status">Loading...</div>
    </div>
    
    <div class="section">
        <h3>📋 About Me</h3>
        <p id="bio"></p>
    </div>
    
    <div class="section">
        <h3>🛠️ Skills</h3>
        <div class="skills" id="skills"></div>
    </div>
    
    <div class="section">
        <h3>💰 Pricing</h3>
        <div class="pricing" id="pricing"></div>
    </div>
    
    <div class="section">
        <h3>📸 Portfolio</h3>
        <div class="portfolio-grid" id="portfolio"></div>
    </div>
    
    <div class="section">
        <h3>⭐ Reviews</h3>
        <div id="reviews" class="reviews"></div>
    </div>
    
    <div class="section">
        <button class="contact-btn" id="contactBtn" onclick="contactWorker()">📩 Contact Worker</button>
    </div>
</div>

<script>
    const workerId = new URLSearchParams(window.location.search).get('id');
    let currentUser = null;
    let workerData = null;
    let showPhone = false;
    
    async function init() {
        const { data: { user } } = await sb.auth.getUser();
        currentUser = user;
        
        if (!workerId) {
            document.body.innerHTML = '<div style="text-align:center; padding:50px;">No worker selected.</div>';
            return;
        }
        
        const { data: profile } = await sb.from('profiles').select('*').eq('id', workerId).single();
        const { data: worker } = await sb.from('workers').select('*').eq('id', workerId).single();
        
        if (!profile || !worker) {
            document.body.innerHTML = '<div style="text-align:center; padding:50px;">Worker not found.</div>';
            return;
        }
        
        workerData = { ...profile, ...worker };
        
        document.getElementById('workerName').innerText = profile.full_name || 'Worker';
        document.getElementById('profession').innerText = worker.profession || 'Professional';
        document.getElementById('bio').innerText = worker.bio || 'No bio provided yet.';
        
        const ratingValue = worker.rating_avg || 0;
        const stars = '★'.repeat(Math.floor(ratingValue)) + '☆'.repeat(5 - Math.floor(ratingValue));
        document.getElementById('rating').innerHTML = `${stars} (${ratingValue.toFixed(1)} from ${worker.rating_count || 0} reviews)`;
        
        const statusEl = document.getElementById('status');
        statusEl.className = `status ${worker.is_available ? 'available' : 'busy'}`;
        statusEl.innerHTML = worker.is_available ? '✅ Available Now' : '⏰ Currently Busy';
        
        if (profile.avatar_url) {
            document.getElementById('avatar').innerHTML = `<img src="${profile.avatar_url}">`;
        }
        
        const { data: skills } = await sb.from('worker_skills').select('skills(*)').eq('worker_id', workerId);
        if (skills && skills.length > 0) {
            document.getElementById('skills').innerHTML = skills.map(s => `<span class="skill-tag">${s.skills?.name}</span>`).join('');
        } else {
            document.getElementById('skills').innerHTML = '<span class="skill-tag">No skills listed</span>';
        }
        
        document.getElementById('pricing').innerHTML = `
            <div class="price-card"><strong>Hourly</strong><br>€${worker.hourly_rate || 'negotiable'}</div>
            <div class="price-card"><strong>Daily</strong><br>€${worker.daily_rate || 'negotiable'}</div>
        `;
        
        const { data: portfolio } = await sb.from('worker_portfolio').select('*').eq('worker_id', workerId);
        if (portfolio && portfolio.length > 0) {
            document.getElementById('portfolio').innerHTML = portfolio.map(p => `
                <div class="portfolio-item">
                    ${p.media_type === 'video' ? 
                        `<video src="${p.media_url}" controls></video>` : 
                        `<img src="${p.media_url}" onerror="this.src='https://via.placeholder.com/150'">`}
                    <div style="padding:8px; font-size:0.8rem;">${p.title || 'Work'}</div>
                </div>
            `).join('');
        } else {
            document.getElementById('portfolio').innerHTML = '<p>No portfolio items yet.</p>';
        }
        
        const { data: reviews } = await sb.from('worker_reviews').select('*, profiles!client_id(*)').eq('worker_id', workerId);
        if (reviews && reviews.length > 0) {
            document.getElementById('reviews').innerHTML = reviews.map(r => `
                <div class="review">
                    <strong>${r.profiles?.full_name || 'Client'}</strong>
                    <span style="color:#f5b042;"> ${'★'.repeat(r.rating)}</span>
                    <p>${r.comment || 'No comment.'}</p>
                </div>
            `).join('');
        } else {
            document.getElementById('reviews').innerHTML = '<p>No reviews yet.</p>';
        }
    }
    
    async function contactWorker() {
        if (!currentUser) {
            window.location.href = 'login.html';
            return;
        }
        
        const profile = await window.API.getProfile(currentUser.id);
        if (profile.role !== 'client') {
            alert('Only clients can contact workers. Please register as a client.');
            return;
        }
        
        let conversation = await window.API.getConversation(currentUser.id, workerId);
        if (!conversation) {
            const newConv = await window.API.createConversation(currentUser.id, workerId);
            conversation = newConv[0];
        }
        window.location.href = `chat.html?conv=${conversation.id}`;
    }
    
    init();
</script>
</body>
</html>
