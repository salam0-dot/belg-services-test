<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile — BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; background: #003366; padding: 12px 0; text-align: center; z-index: 999; }
        .top-nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; font-size: 16px; }
        header { margin-top: 100px; text-align: center; padding: 20px; }
        .company-logo { width: 140px; height: 140px; border-radius: 12px; object-fit: cover; border: 4px solid #003366; background: #eee; }
        h1 { color: #003366; font-size: 32px; margin-top: 10px; }
        .rating { color: #f4c542; font-size: 20px; }
        .info-boxes { max-width: 900px; margin: 20px auto; display: flex; gap: 15px; flex-wrap: wrap; }
        .info-box { flex: 1; min-width: 200px; background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .info-box h3 { margin: 0; color: #003366; }
        .section { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .section h2 { color: #003366; margin-bottom: 10px; }
        .gallery { display: flex; gap: 10px; flex-wrap: wrap; }
        .gallery img { width: 150px; height: 120px; border-radius: 8px; object-fit: cover; background: #eee; }
        .action-btn { padding: 12px 20px; background: #003366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; margin-right: 5px; }
        .action-btn:hover { background: #002244; }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="company-dashboard.html">Companies</a>
    <a href="payment.html">Payment</a>
</nav>

<header>
    <img id="compLogo" src="" class="company-logo" alt="Logo">
    <h1 id="compName">Loading...</h1>
    <div class="rating" id="compRating">★★★★★</div>
</header>

<div class="info-boxes">
    <div class="info-box"><h3>Projects</h3><p id="compProjects">0</p></div>
    <div class="info-box"><h3>Response</h3><p>Fast</p></div>
    <div class="info-box"><h3>Location</h3><p id="compAddress">-</p></div>
</div>

<div class="section">
    <h2>About the Company</h2>
    <p id="compBio">Loading information...</p>
</div>

<div class="section">
    <h2>Completed Work</h2>
    <div class="gallery" id="compGallery">
        </div>
</div>

<div class="section">
    <button class="action-btn" onclick="requestWorkers()">Book Service</button>
    <button class="action-btn" onclick="openChat()">Open Chat</button>
</div>

<script>
    const sb = supabase.createClient(window.env.URL, window.env.KEY);

    async function loadCompanyProfile() {
        // الحصول على الـ ID من الرابط (مثلاً: company-profile.html?id=123)
        const urlParams = new URLSearchParams(window.location.search);
        const companyId = urlParams.get('id');

        if (!companyId) {
            alert("No company selected");
            return;
        }

        // 1. جلب بيانات البروفايل
        const { data: profile, error } = await sb.from('profiles').select('*').eq('id', companyId).single();

        if (profile) {
            document.getElementById('compName').innerText = profile.full_name;
            document.getElementById('compLogo').src = profile.avatar_url || 'https://via.placeholder.com/140';
            document.getElementById('compBio').innerText = profile.bio || "No description available.";
            document.getElementById('compAddress').innerText = profile.address || "Belgium";
            document.getElementById('compRating').innerText = "★".repeat(Math.floor(profile.rating || 5)) + ` (${profile.rating || 5.0})`;
        }

        // 2. جلب صور المعرض
        const { data: gallery } = await sb.from('work_gallery').select('*').eq('user_id', companyId);
        if (gallery && gallery.length > 0) {
            const galleryDiv = document.getElementById('compGallery');
            galleryDiv.innerHTML = gallery.map(img => `<img src="${img.image_url}" alt="Work">`).join('');
            document.getElementById('compProjects').innerText = gallery.length + "+";
        }
    }

    function requestWorkers() { window.location.href = "payment.html"; }
    function openChat() { window.location.href = "chat.html"; }

    loadCompanyProfile();
</script>
</body>
</html>
