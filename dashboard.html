<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #fefcf5; margin: 0; padding: 0; }
        nav { background: #c49a6c; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; color: white; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: #c49a6c; margin-top: 0; }
        input, textarea, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #c49a6c; color: white; border: none; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item { border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
        .gallery-item img { width: 100%; height: 150px; object-fit: cover; }
        .hidden { display: none; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: bold; font-size: 20px;">BELG SERVICES</div>
    <button onclick="logout()" style="width: auto; background: #a57c52;">Logout</button>
</nav>

<div class="container">
    <div class="card">
        <h2 id="welcomeMsg">Welcome</h2>
        <p id="userRoleBadge" style="display: inline-block; padding: 5px 15px; background: #e1d5c6; border-radius: 20px; font-size: 12px;"></p>
    </div>

    <div id="socialSection" class="card hidden">
        <h2>Social Media Links</h2>
        <input type="text" id="instaLink" placeholder="Instagram URL">
        <input type="text" id="fbLink" placeholder="Facebook URL">
        <input type="text" id="waNumber" placeholder="WhatsApp Number">
        <button onclick="saveSocial()">Update Links</button>
    </div>

    <div id="gallerySection" class="card hidden">
        <h2>Work Gallery</h2>
        <input type="text" id="imgUrl" placeholder="Image URL">
        <input type="text" id="imgTitle" placeholder="Project Title">
        <button onclick="uploadPhoto()">Add Photo</button>
        <div id="galleryGrid" class="grid" style="margin-top: 20px;"></div>
    </div>

    <div class="card">
        <h2>Profile Details</h2>
        <input type="text" id="dispName" placeholder="Full Name">
        <textarea id="bioText" placeholder="Bio / Description"></textarea>
        <button onclick="saveProfile()">Save Changes</button>
    </div>
</div>

<script>
    const sb = supabase.createClient(window.env.URL, window.env.KEY);
    let currentUser = null;

    async function init() {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;

        const profile = await window.API.getProfile(user.id);
        
        document.getElementById('welcomeMsg').innerText = `Welcome, ${profile.full_name}`;
        document.getElementById('userRoleBadge').innerText = profile.role.toUpperCase();
        document.getElementById('dispName').value = profile.full_name || '';
        document.getElementById('bioText').value = profile.bio || '';

        if (profile.role === 'worker' || profile.role === 'company') {
            document.getElementById('socialSection').classList.remove('hidden');
            document.getElementById('gallerySection').classList.remove('hidden');
            document.getElementById('instaLink').value = profile.instagram_url || '';
            document.getElementById('fbLink').value = profile.facebook_url || '';
            document.getElementById('waNumber').value = profile.whatsapp_number || '';
            loadGallery();
        }
    }

    async function saveProfile() {
        const updates = {
            full_name: document.getElementById('dispName').value,
            bio: document.getElementById('bioText').value,
            updated_at: new Date()
        };
        await window.API.updateProfile(currentUser.id, updates);
        alert('Profile Updated');
    }

    async function saveSocial() {
        const updates = {
            instagram_url: document.getElementById('instaLink').value,
            facebook_url: document.getElementById('fbLink').value,
            whatsapp_number: document.getElementById('waNumber').value
        };
        await window.API.updateProfile(currentUser.id, updates);
        alert('Links Updated');
    }

    async function uploadPhoto() {
        const url = document.getElementById('imgUrl').value;
        const title = document.getElementById('imgTitle').value;
        if (!url) return;
        await window.API.uploadWork(currentUser.id, url, title);
        loadGallery();
    }

    async function loadGallery() {
        const photos = await window.API.getGallery(currentUser.id);
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = photos.map(p => `
            <div class="gallery-item">
                <img src="${p.image_url}">
                <p style="padding: 5px; font-size: 12px; margin: 0;">${p.title || ''}</p>
            </div>
        `).join('');
    }

    async function logout() {
        await sb.auth.signOut();
        window.location.href = 'index.html';
    }

    init();
</script>
</body>
</html>
