<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Dashboard - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fefcf5; color: #2c3e2f; }
        
        nav { 
            background: white; 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #e2cfbc;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 1.4rem; color: #c49a6c; letter-spacing: -1px; }
        .logout-btn { 
            background: #f5f0ea; color: #a57c52; border: none; 
            padding: 8px 20px; border-radius: 50px; font-weight: 600; 
            cursor: pointer; transition: 0.3s;
        }
        .logout-btn:hover { background: #a57c52; color: white; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        .welcome-card { 
            background: linear-gradient(135deg, #c49a6c, #a57c52); 
            padding: 40px; border-radius: 40px; color: white; 
            margin-bottom: 30px; box-shadow: 0 15px 30px rgba(196,154,108,0.2);
        }
        .welcome-card h1 { font-size: 2.2rem; margin-bottom: 10px; }
        .role-badge { 
            background: rgba(255,255,255,0.2); padding: 5px 15px; 
            border-radius: 50px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; 
        }

        .card { 
            background: white; padding: 30px; border-radius: 35px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #f0e6db;
            margin-bottom: 25px; 
        }
        h2 { font-size: 1.3rem; margin-bottom: 20px; color: #1e2a2f; display: flex; align-items: center; gap: 10px; }
        h2 i { color: #c49a6c; }

        input, textarea { 
            width: 100%; padding: 14px 20px; margin-bottom: 15px; 
            border-radius: 15px; border: 1.5px solid #eee; 
            font-family: inherit; transition: 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: #c49a6c; background: #fffdfc; }

        .btn-save { 
            background: #c49a6c; color: white; border: none; 
            padding: 12px 30px; border-radius: 50px; font-weight: 700; 
            cursor: pointer; transition: 0.3s; width: auto;
        }
        .btn-save:hover { background: #a57c52; transform: translateY(-2px); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .gallery-item { 
            border-radius: 20px; overflow: hidden; background: #fafafa; border: 1px solid #eee;
            transition: 0.3s;
        }
        .gallery-item:hover { transform: scale(1.03); }
        .gallery-item img { width: 100%; height: 160px; object-fit: cover; }
        .gallery-item p { padding: 12px; font-size: 0.85rem; font-weight: 600; text-align: center; }

        .hidden { display: none; }
        
        @media (max-width: 600px) {
            .welcome-card { padding: 25px; border-radius: 25px; }
            .card { border-radius: 25px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">BELG SERVICES</div>
    <button class="logout-btn" onclick="window.Auth.signOut()"><i class="fas fa-sign-out-alt"></i> Logout</button>
</nav>

<div class="container">
    <div class="welcome-card">
        <span class="role-badge" id="userRoleBadge">Loading...</span>
        <h1 id="welcomeMsg">Welcome back</h1>
        <p>Manage your professional profile and portfolio</p>
    </div>

    <div id="gallerySection" class="card hidden">
        <h2><i class="fas fa-images"></i> Portfolio Gallery</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="imgUrl" placeholder="Paste Image URL here..." style="flex: 2;">
            <input type="text" id="imgTitle" placeholder="Project Name" style="flex: 1;">
            <select id="mediaType" style="flex: 1; padding: 12px; border-radius: 15px; border: 1.5px solid #eee;">
                <option value="image">Image</option>
                <option value="video">Video</option>
            </select>
        </div>
        <button class="btn-save" onclick="uploadPhoto()"><i class="fas fa-plus"></i> Add to Portfolio</button>
        <div id="galleryGrid" class="grid"></div>
    </div>

    <div id="companyProjectsSection" class="card hidden">
        <h2><i class="fas fa-building"></i> Company Projects</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="projectTitle" placeholder="Project Title" style="flex: 2;">
            <textarea id="projectDesc" placeholder="Project Description" rows="2" style="width: 100%;"></textarea>
            <select id="projectStatus" style="padding: 12px; border-radius: 15px; border: 1.5px solid #eee;">
                <option value="completed">Completed</option>
                <option value="in_progress">In Progress</option>
                <option value="planned">Planned</option>
            </select>
        </div>
        <button class="btn-save" onclick="addCompanyProject()"><i class="fas fa-plus"></i> Add Project</button>
        <div id="projectsGrid" class="grid"></div>
    </div>

    <div id="socialSection" class="card hidden">
        <h2><i class="fas fa-share-alt"></i> Social Presence</h2>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
            <input type="text" id="instaLink" placeholder="Instagram Profile Link">
            <input type="text" id="fbLink" placeholder="Facebook Page Link">
            <input type="text" id="waNumber" placeholder="WhatsApp (e.g. +32...)">
        </div>
        <button class="btn-save" onclick="saveSocial()">Update Socials</button>
    </div>

    <div class="card">
        <h2><i class="fas fa-user-circle"></i> Profile Details</h2>
        <label style="font-size: 0.8rem; font-weight: 700; margin-left: 5px;">DISPLAY NAME</label>
        <input type="text" id="dispName" placeholder="Your Full Name">
        
        <label style="font-size: 0.8rem; font-weight: 700; margin-left: 5px;">BIO / ABOUT</label>
        <textarea id="bioText" rows="4" placeholder="Tell clients about your expertise..."></textarea>
        
        <label style="font-size: 0.8rem; font-weight: 700; margin-left: 5px;">HOURLY RATE (for workers)</label>
        <input type="number" id="hourlyRate" placeholder="Hourly rate in USD">
        
        <button class="btn-save" onclick="saveProfile()">Save Profile</button>
    </div>
</div>

<script>
    const sb = supabase.createClient(window.env.URL, window.env.KEY);
    let currentUser = null;
    let currentUserRole = null;

    async function loadProfileData() {
        const profile = await window.API.getProfile(currentUser.id);
        if (profile) {
            document.getElementById('dispName').value = profile.full_name || '';
            document.getElementById('bioText').value = profile.bio || '';
        }
        
        if (currentUserRole === 'worker') {
            const worker = await window.API.getWorker(currentUser.id);
            if (worker) {
                document.getElementById('hourlyRate').value = worker.hourly_rate || '';
                document.getElementById('instaLink').value = worker.instagram || '';
                document.getElementById('fbLink').value = worker.facebook || '';
                document.getElementById('waNumber').value = worker.whatsapp || '';
            }
        } else if (currentUserRole === 'company') {
            const company = await window.API.getCompany(currentUser.id);
            if (company) {
                document.getElementById('instaLink').value = company.instagram || '';
                document.getElementById('fbLink').value = company.facebook || '';
                document.getElementById('waNumber').value = company.whatsapp || '';
            }
        }
    }

    async function init() {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;

        const profile = await window.API.getProfile(user.id);
        currentUserRole = profile.role;
        
        document.getElementById('welcomeMsg').innerText = `Welcome, ${profile.full_name || 'User'}`;
        document.getElementById('userRoleBadge').innerText = profile.role || 'User';
        
        await loadProfileData();

        document.getElementById('socialSection').classList.remove('hidden');

        if (profile.role === 'worker') {
            document.getElementById('gallerySection').classList.remove('hidden');
            loadWorkerPortfolio();
        } else if (profile.role === 'company') {
            document.getElementById('companyProjectsSection').classList.remove('hidden');
            loadCompanyProjects();
        }
    }

    async function saveProfile() {
        const updates = {
            full_name: document.getElementById('dispName').value,
            bio: document.getElementById('bioText').value,
            updated_at: new Date()
        };
        
        const profileSuccess = await window.API.updateProfile(currentUser.id, updates);
        
        let roleSuccess = true;
        if (currentUserRole === 'worker') {
            roleSuccess = await window.API.updateWorker(currentUser.id, {
                hourly_rate: document.getElementById('hourlyRate').value
            });
        }
        
        if (profileSuccess && roleSuccess) {
            alert('✅ Profile Updated Successfully');
            await loadProfileData();
        } else {
            alert('❌ Failed to update profile');
        }
    }

    async function saveSocial() {
        let success = false;
        const socialData = {
            instagram: document.getElementById('instaLink').value,
            facebook: document.getElementById('fbLink').value,
            whatsapp: document.getElementById('waNumber').value
        };
        
        if (currentUserRole === 'worker') {
            success = await window.API.updateWorker(currentUser.id, socialData);
        } else if (currentUserRole === 'company') {
            success = await window.API.updateCompany(currentUser.id, socialData);
        }
        
        if (success) {
            alert('🔗 Social Links Updated Successfully');
        } else {
            alert('❌ Failed to update social links');
        }
    }

    async function uploadPhoto() {
        const url = document.getElementById('imgUrl').value;
        const title = document.getElementById('imgTitle').value;
        const mediaType = document.getElementById('mediaType').value;
        
        if (!url) { alert('Please enter image URL'); return; }
        
        await window.API.addWorkerPortfolio(currentUser.id, title, url, mediaType);
        document.getElementById('imgUrl').value = '';
        document.getElementById('imgTitle').value = '';
        loadWorkerPortfolio();
    }

    async function loadWorkerPortfolio() {
        const items = await window.API.getWorkerPortfolio(currentUser.id);
        const grid = document.getElementById('galleryGrid');
        if (items && items.length > 0) {
            grid.innerHTML = items.map(item => `
                <div class="gallery-item">
                    ${item.media_type === 'video' ? 
                        `<video src="${item.media_url}" controls style="width:100%; height:160px; object-fit:cover;"></video>` :
                        `<img src="${item.media_url}" onerror="this.src='https://via.placeholder.com/300x200?text=Invalid+URL'">`
                    }
                    <p>${item.title || 'Project'}</p>
                </div>
            `).join('');
        } else {
            grid.innerHTML = '<p style="text-align:center; color:#999;">No portfolio items yet. Add your first project above.</p>';
        }
    }

    async function addCompanyProject() {
        const title = document.getElementById('projectTitle').value;
        const description = document.getElementById('projectDesc').value;
        const status = document.getElementById('projectStatus').value;
        
        if (!title) { alert('Please enter project title'); return; }
        
        await window.API.addCompanyProject(currentUser.id, title, description, status, null);
        document.getElementById('projectTitle').value = '';
        document.getElementById('projectDesc').value = '';
        loadCompanyProjects();
    }

    async function loadCompanyProjects() {
        const projects = await window.API.getCompanyProjects(currentUser.id);
        const grid = document.getElementById('projectsGrid');
        if (projects && projects.length > 0) {
            grid.innerHTML = projects.map(project => `
                <div class="gallery-item">
                    <div style="padding: 15px;">
                        <h3 style="color: #c49a6c;">${project.title}</h3>
                        <p style="font-size: 0.8rem; margin: 8px 0;">${project.description || ''}</p>
                        <span style="background: #f0e6db; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem;">${project.status}</span>
                        <p style="font-size: 0.7rem; margin-top: 8px;">${project.completion_date || new Date(project.created_at).toLocaleDateString()}</p>
                    </div>
                </div>
            `).join('');
        } else {
            grid.innerHTML = '<p style="text-align:center; color:#999;">No projects yet. Add your first project above.</p>';
        }
    }

    init();
</script>
</body>
    </html>
