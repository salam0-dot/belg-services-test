<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Client Portal - BELG SERVICES</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fefcf5; color: #1e2a2f; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: white; border-bottom: 1px solid #f0e4d8; flex-wrap: wrap; gap: 20px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 45px; width: auto; }
        .logo-text { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #c49a6c, #8b5a2b); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; font-weight: 500; color: #2c3e2f; transition: 0.2s; }
        .nav-links a:hover { color: #c49a6c; }
        .logout-btn { background: #f5f0ea; color: #a57c52; border: none; padding: 8px 20px; border-radius: 50px; font-weight: 600; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .card { background: white; border-radius: 28px; padding: 30px; margin-bottom: 30px; box-shadow: 0 6px 14px rgba(0,0,0,0.05); border: 1px solid #f0e4d8; }
        .card h2 { color: #c49a6c; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px 16px; margin: 8px 0 16px; border: 1px solid #e0d4c8; border-radius: 12px; font-family: inherit; }
        button { background: #c49a6c; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        button:hover { background: #a57c52; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .worker-card, .company-card { background: #fefcf5; border-radius: 20px; padding: 20px; border: 1px solid #f0e4d8; cursor: pointer; transition: 0.2s; }
        .worker-card:hover, .company-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #f0e4d8; color: #5a4a3a; }
        .tab-btn.active { background: #c49a6c; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .hidden { display: none; }
        .message { padding: 10px; margin: 10px 0; border-radius: 10px; }
        .error { background: #ffe0e0; color: red; }
        .success { background: #e0ffe0; color: green; }
        .chat-box { border: 1px solid #e0d4c8; border-radius: 16px; height: 300px; overflow-y: auto; padding: 15px; margin: 15px 0; background: #fefcf5; }
        .chat-message { margin: 8px 0; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
        .chat-message.sent { background: #c49a6c; color: white; margin-left: auto; text-align: right; }
        .chat-message.received { background: #f0e4d8; color: #333; }
        .stars { display: inline-flex; gap: 5px; cursor: pointer; }
        .star { font-size: 28px; color: #ddd; transition: 0.2s; }
        .star.selected { color: #f5b042; }
        @media (max-width: 768px) { .navbar { padding: 16px 20px; flex-direction: column; } .nav-links { flex-wrap: wrap; justify-content: center; } }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo-area">
        <img src="logo.png" alt="logo" class="logo-img" onerror="this.src='https://placehold.co/50x50?text=BS'">
        <span class="logo-text">BELG SERVICES</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="client.html" style="color:#c49a6c;">Clients</a></li>
        <li><a href="register.html">Join</a></li>
    </ul>
</div>

<div class="container">
    <!-- Auth Section (shown when not logged in) -->
    <div id="authSection" class="card">
        <h2>Client Portal</h2>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>
        <div id="loginTab" class="tab-content active">
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="clientLogin()">Sign In</button>
            <div id="loginMsg"></div>
        </div>
        <div id="registerTab" class="tab-content">
            <input type="text" id="regName" placeholder="Full Name">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPassword" placeholder="Password">
            <input type="text" id="regAddress" placeholder="Address">
            <input type="text" id="regCity" placeholder="City">
            <button onclick="clientRegister()">Create Account</button>
            <div id="registerMsg"></div>
        </div>
    </div>

    <!-- Dashboard Section (shown when logged in) -->
    <div id="dashboardSection" class="hidden">
        <div class="card">
            <h2>Welcome, <span id="clientName"></span> 👋</h2>
            <button class="logout-btn" onclick="clientLogout()">Logout</button>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showClientTab('search')">🔍 Search</button>
            <button class="tab-btn" onclick="showClientTab('bookings')">📋 My Bookings</button>
            <button class="tab-btn" onclick="showClientTab('chat')">💬 Messages</button>
        </div>

        <!-- Search Tab -->
        <div id="searchTab" class="tab-content active">
            <div class="card">
                <h2>Find Workers or Companies</h2>
                <input type="text" id="searchInput" placeholder="Search by name or profession...">
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="searchType('workers')">👷 Workers</button>
                    <button class="tab-btn" onclick="searchType('companies')">🏢 Companies</button>
                </div>
                <div id="searchResults" class="grid"></div>
            </div>
        </div>

        <!-- Bookings Tab -->
        <div id="bookingsTab" class="tab-content">
            <div class="card">
                <h2>My Bookings</h2>
                <div id="bookingsList"></div>
            </div>
        </div>

        <!-- Chat Tab -->
        <div id="chatTab" class="tab-content">
            <div class="card">
                <h2>Conversations</h2>
                <select id="chatSelect" onchange="loadMessages()">
                    <option value="">Select a conversation...</option>
                </select>
                <div id="chatMessages" class="chat-box"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1;">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const sb = supabase.createClient(window.env.URL, window.env.KEY);
    let currentClient = null;
    let currentSearchType = 'workers';
    let currentConversationId = null;
    let currentReviewBooking = null;
    let currentReviewTargetId = null;
    let currentReviewTargetType = null;

    async function clientLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('loginMsg');
        try {
            const data = await window.Auth.signIn(email, password);
            if (data.user) {
                const profile = await window.API.getProfile(data.user.id);
                if (profile.role !== 'client') {
                    await window.Auth.signOut();
                    msgDiv.innerHTML = '<div class="message error">This account is not a client account.</div>';
                    return;
                }
                currentClient = data.user;
                showClientDashboard();
            }
        } catch (error) {
            msgDiv.innerHTML = '<div class="message error">' + error.message + '</div>';
        }
    }

    async function clientRegister() {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const address = document.getElementById('regAddress').value;
        const city = document.getElementById('regCity').value;
        const msgDiv = document.getElementById('registerMsg');
        try {
            const data = await window.Auth.signUp(email, password, name, 'client');
            if (data.user) {
                await window.API.updateClient(data.user.id, { address: address, city: city });
                msgDiv.innerHTML = '<div class="message success">Account created! Please login.</div>';
                switchTab('login');
            }
        } catch (error) {
            msgDiv.innerHTML = '<div class="message error">' + error.message + '</div>';
        }
    }

    async function showClientDashboard() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        const profile = await window.API.getProfile(currentClient.id);
        document.getElementById('clientName').innerText = profile.full_name || 'Client';
        await loadSearchResults();
        await loadBookings();
        await loadConversations();
    }

    async function clientLogout() {
        await window.Auth.signOut();
        location.reload();
    }

    function switchTab(tab) {
        document.getElementById('loginTab').classList.remove('active');
        document.getElementById('registerTab').classList.remove('active');
        if (tab === 'login') {
            document.getElementById('loginTab').classList.add('active');
        } else {
            document.getElementById('registerTab').classList.add('active');
        }
    }

    function showClientTab(tab) {
        document.getElementById('searchTab').classList.remove('active');
        document.getElementById('bookingsTab').classList.remove('active');
        document.getElementById('chatTab').classList.remove('active');
        if (tab === 'search') {
            document.getElementById('searchTab').classList.add('active');
            loadSearchResults();
        } else if (tab === 'bookings') {
            document.getElementById('bookingsTab').classList.add('active');
            loadBookings();
        } else {
            document.getElementById('chatTab').classList.add('active');
        }
    }

    function searchType(type) {
        currentSearchType = type;
        document.querySelectorAll('#searchTab .tab-buttons .tab-btn').forEach(btn => btn.classList.remove('active'));
        if (type === 'workers') {
            document.querySelector('#searchTab .tab-buttons .tab-btn:first-child').classList.add('active');
        } else {
            document.querySelector('#searchTab .tab-buttons .tab-btn:last-child').classList.add('active');
        }
        loadSearchResults();
    }

    async function loadSearchResults() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('searchResults');
        
        if (currentSearchType === 'workers') {
            const { data: workers } = await sb.from('workers').select('*, profiles!inner(*)');
            let filtered = workers || [];
            if (term) {
                filtered = filtered.filter(w => 
                    w.profiles?.full_name?.toLowerCase().includes(term) || 
                    w.profession?.toLowerCase().includes(term)
                );
            }
            container.innerHTML = filtered.map(w => `
                <div class="worker-card" onclick="bookWorker('${w.id}')">
                    <h3>${w.profiles?.full_name || 'Worker'}</h3>
                    <p>${w.profession || 'Professional'}</p>
                    <p>💰 €${w.hourly_rate || 'N/A'}/hour</p>
                    <p>⭐ ${w.rating_avg ? w.rating_avg.toFixed(1) : 'New'} (${w.rating_count || 0} reviews)</p>
                    <button style="margin-top:10px;">Book Now</button>
                </div>
            `).join('');
        } else {
            const { data: companies } = await sb.from('companies').select('*, profiles!inner(*)');
            let filtered = companies || [];
            if (term) {
                filtered = filtered.filter(c => 
                    c.company_name?.toLowerCase().includes(term) || 
                    c.profiles?.full_name?.toLowerCase().includes(term)
                );
            }
            container.innerHTML = filtered.map(c => `
                <div class="company-card" onclick="bookCompany('${c.id}')">
                    <h3>${c.company_name || c.profiles?.full_name}</h3>
                    <p>${c.description?.substring(0, 80) || 'Professional company'}</p>
                    <p>⭐ ${c.rating_avg ? c.rating_avg.toFixed(1) : 'New'}</p>
                    <button style="margin-top:10px;">Contact Company</button>
                </div>
            `).join('');
        }
    }

    async function bookWorker(workerId) {
        const serviceType = prompt('What service do you need?');
        if (!serviceType) return;
        const bookingDate = prompt('When? (YYYY-MM-DD)');
        if (!bookingDate) return;
        await window.API.addBooking(currentClient.id, 'worker', workerId, serviceType, null, bookingDate, '');
        alert('✅ Booking request sent!');
        loadBookings();
    }

    async function bookCompany(companyId) {
        const serviceType = prompt('What service do you need?');
        if (!serviceType) return;
        await window.API.addBooking(currentClient.id, 'company', companyId, serviceType, null, new Date().toISOString().split('T')[0], '');
        alert('✅ Inquiry sent to company!');
        loadBookings();
    }

    async function loadBookings() {
        const bookings = await window.API.getBookingsByClient(currentClient.id);
        const container = document.getElementById('bookingsList');
        if (!bookings || bookings.length === 0) {
            container.innerHTML = '<p>No bookings yet.</p>';
            return;
        }
        container.innerHTML = bookings.map(b => `
            <div class="worker-card" style="margin-bottom:15px;">
                <p><strong>Service:</strong> ${b.service_type}</p>
                <p><strong>Date:</strong> ${b.booking_date}</p>
                <p><strong>Status:</strong> ${b.status}</p>
                ${b.status === 'completed' ? 
                    `<button onclick="showReviewForm('${b.id}', '${b.target_id}', '${b.target_type}')">⭐ Rate & Review</button>` : 
                    (b.status === 'pending' ? `<button onclick="markAsCompleted('${b.id}')">✅ Mark as Completed</button>` : '')
                }
            </div>
        `).join('');
    }

    async function markAsCompleted(bookingId) {
        await window.API.updateBookingStatus(bookingId, 'completed');
        alert('Booking marked as completed! You can now leave a review.');
        loadBookings();
    }

    function showReviewForm(bookingId, targetId, targetType) {
        currentReviewBooking = bookingId;
        currentReviewTargetId = targetId;
        currentReviewTargetType = targetType;
        
        const container = document.getElementById('bookingsList');
        const formHtml = `
            <div id="reviewFormContainer" style="margin-top: 20px; padding: 20px; background: #fefcf5; border-radius: 20px; border: 1px solid #f0e4d8;">
                <h3>⭐ Rate Your Experience</h3>
                <div class="stars" id="starSelector">
                    ${[1,2,3,4,5].map(star => `<span class="star" onclick="setRating(${star})">★</span>`).join('')}
                </div>
                <input type="hidden" id="selectedRating" value="5">
                <textarea id="reviewComment" rows="3" placeholder="Share your experience... (optional)" style="width:100%; margin: 15px 0;"></textarea>
                <button onclick="submitReview()">Submit Review</button>
                <button onclick="cancelReview()">Cancel</button>
            </div>
        `;
        
        const existingForm = document.getElementById('reviewFormContainer');
        if (existingForm) existingForm.remove();
        
        const bookingsDiv = document.getElementById('bookingsList');
        bookingsDiv.insertAdjacentHTML('beforeend', formHtml);
    }

    function setRating(rating) {
        document.getElementById('selectedRating').value = rating;
        const stars = document.querySelectorAll('#starSelector .star');
        stars.forEach((star, i) => {
            if (i < rating) {
                star.style.color = '#f5b042';
            } else {
                star.style.color = '#ddd';
            }
        });
    }

    async function submitReview() {
        const rating = parseInt(document.getElementById('selectedRating').value);
        const comment = document.getElementById('reviewComment').value;
        
        try {
            if (currentReviewTargetType === 'worker') {
                await window.API.addWorkerReview(currentReviewTargetId, currentClient.id, rating, comment);
                alert('✅ Worker review submitted! Thank you for your feedback.');
            } else if (currentReviewTargetType === 'company') {
                await window.API.addCompanyReview(currentReviewTargetId, currentClient.id, rating, comment);
                alert('✅ Company review submitted! Thank you for your feedback.');
            }
            cancelReview();
            loadBookings();
        } catch (error) {
            alert('Error submitting review: ' + error.message);
        }
    }

    function cancelReview() {
        const form = document.getElementById('reviewFormContainer');
        if (form) form.remove();
        currentReviewBooking = null;
        currentReviewTargetId = null;
        currentReviewTargetType = null;
    }

    async function loadConversations() {
        const convos = await window.API.getUserConversations(currentClient.id);
        const select = document.getElementById('chatSelect');
        select.innerHTML = '<option value="">Select a conversation...</option>';
        for (const convo of convos) {
            const otherId = convo.participant1 === currentClient.id ? convo.participant2 : convo.participant1;
            const otherProfile = await window.API.getProfile(otherId);
            select.innerHTML += `<option value="${convo.id}">${otherProfile?.full_name || 'User'}</option>`;
        }
    }

    async function loadMessages() {
        const convoId = document.getElementById('chatSelect').value;
        if (!convoId) return;
        currentConversationId = convoId;
        const messages = await window.API.getMessages(convoId);
        const
