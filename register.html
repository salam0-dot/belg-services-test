<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELG SERVICES - Create Account</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #c49a6c; color: white; font-weight: bold; border: none; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <h2>BELG SERVICES - Create Account</h2>
    <input type="text" id="fullName" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <select id="userType">
        <option value="client">Client</option>
        <option value="worker">Worker</option>
        <option value="company">Company</option>
    </select>
    <button onclick="handleRegister()">Create Account</button>
    <div id="message"></div>

    <script>
        async function handleRegister() {
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userType = document.getElementById('userType').value;
            const messageDiv = document.getElementById('message');
            
            if (!fullName || !email || !password) {
                messageDiv.innerHTML = '<span class="error">Please fill in all fields</span>';
                return;
            }
            
            messageDiv.innerHTML = 'Creating account...';
            
            try {
                // استخدام Auth.js الذي أنشأناه للربط مع Supabase
                const data = await window.Auth.signUp(email, password, fullName, userType);
                
                messageDiv.innerHTML = '<span class="success">✅ Account created successfully! You can now log in.</span>';
                
                // مسح الحقول
                document.getElementById('fullName').value = '';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                messageDiv.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
                console.error(error);
            }
        }
    </script>
</body>
</html>
