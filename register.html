<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELG SERVICES - تسجيل حساب</title>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.0/dist/pocketbase.umd.js"></script>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #c49a6c; color: white; font-weight: bold; border: none; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>BELG SERVICES - إنشاء حساب جديد</h2>
    <input type="text" id="fullName" placeholder="الاسم الكامل (Full Name)">
    <input type="email" id="email" placeholder="البريد الإلكتروني (Email)">
    <input type="password" id="password" placeholder="كلمة المرور (Password)">
    <select id="userType">
        <option value="client">عميل (Client)</option>
        <option value="worker">عامل (Worker)</option>
        <option value="company">شركة (Company)</option>
    </select>
    <button onclick="register()">Create Account</button>
    <div id="message"></div>

    <script>
        // ⚠️ هام: هذا هو عنوان خادم PocketBase على هاتفك. تأكد من صحته.
        const PB_URL = 'http://10.74.69.116:8080';
        const pb = new PocketBase(PB_URL);

        async function register() {
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const userType = document.getElementById('userType').value;
            const messageDiv = document.getElementById('message');
            
            if (!fullName || !email || !password) {
                messageDiv.innerHTML = '<span class="error">الرجاء ملء جميع الحقول</span>';
                return;
            }
            
            messageDiv.innerHTML = 'جاري إنشاء الحساب...';
            
            try {
                const data = {
                    email: email,
                    password: password,
                    passwordConfirm: password,
                    full_name: fullName,
                    user_type: userType
                };
                
                const record = await pb.collection('users').create(data);
                
                messageDiv.innerHTML = '<span class="success">✅ تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.</span>';
                console.log("Record created: ", record);
                document.getElementById('fullName').value = '';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            } catch (error) {
                messageDiv.innerHTML = '<span class="error">❌ فشل إنشاء الحساب: ' + error.message + '</span>';
                console.error(error);
            }
        }
    </script>
</body>
</html>
